<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f9ff">
  <title>订阅管理</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/shared.css">
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/shared.js" defer></script>
  <script src="/assets/dashboard.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="wordmark" href="/dashboard"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#layers"></use></svg></span>Proxy Subs</a>
      <nav class="side-nav">
        <a class="nav-item" href="/dashboard" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#grid"></use></svg>订阅管理</a>
        <a class="nav-item" href="/settings" ><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#shield"></use></svg>安全设置</a>
        <a class="nav-item" href="/users"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#users"></use></svg>用户管理</a>
      </nav>
    </aside>
    <header class="topbar">
      <h1>订阅管理</h1>
      <div class="account"><span id="account-name">管理员</span><button id="logout-button" class="button button-quiet" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#logout"></use></svg>退出</button></div>
    </header>

    <main class="dashboard">

      <section class="overview" aria-label="服务概览">
        <article class="metric-card"><div class="metric-top"><span class="metric-label">全部订阅</span><span class="metric-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#layers"></use></svg></span></div><strong id="total-count">—</strong></article>
        <article class="metric-card"><div class="metric-top"><span class="metric-label">可用文件</span><span class="metric-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#file"></use></svg></span></div><strong id="ready-count">—</strong></article>
        <article class="switch-card">
          <div class="metric-top"><span class="metric-label">订阅服务</span><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#activity"></use></svg></div>
          <div class="service-control"><div class="card-heading"><span id="service-dot" class="status-dot off"></span><h2 id="service-label">正在连接</h2></div><label class="switch"><input id="api-switch" type="checkbox" role="switch" aria-label="订阅服务总开关" disabled><span class="switch-track"><span class="switch-thumb"></span></span></label></div>
        </article>
      </section>

      <section class="content-card">
        <div class="content-heading">
          <div class="filter-group" role="group" aria-label="筛选订阅状态">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter-button" type="button" data-filter="enabled" aria-pressed="false">已启用</button>
            <button class="filter-button" type="button" data-filter="disabled" aria-pressed="false">已停用</button>
          </div>
          <div class="list-tools">
            <label class="search-field"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#search"></use></svg><input id="search-input" type="search" placeholder="搜索订阅" aria-label="搜索订阅名称、URL 或文件"></label>
            <button id="add-button" class="button button-primary" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#plus"></use></svg>新建订阅</button>
          </div>
        </div>
        <div id="load-state" class="load-state" role="status">正在加载订阅配置…</div>
        <div id="load-error" class="empty-state compact" hidden><h3>暂时无法加载订阅</h3><p id="load-error-message"></p><button id="retry-button" class="button button-secondary" type="button">重新加载</button></div>
        <div class="table-heading" aria-hidden="true"><span>订阅 / 状态</span><span>访问地址</span><span>源文件</span><span>操作</span></div>
        <div id="subscription-list" class="subscription-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#layers"></use></svg></div>
          <h3>暂无订阅</h3>
          <button class="button button-primary" data-action="add" type="button">新建订阅</button>
        </div>
        <div id="no-results" class="empty-state compact" hidden>
          <h3>没有匹配结果</h3>
        </div>
        <div id="result-count" class="list-footer" aria-live="polite">正在加载…</div>
      </section>
    </main>
  </div>

  <div id="editor-backdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <div class="modal-heading">
        <div>
          <h2 id="editor-title">新建订阅</h2>
        </div>
        <button class="icon-button" data-action="close-editor" type="button" aria-label="关闭">×</button>
      </div>
      <form id="editor-form" novalidate>
        <input id="subscription-id" type="hidden">
        <div class="form-grid">
          <label>
            <span>订阅名称</span>
            <input id="subscription-name" maxlength="80" placeholder="例如：Clash 主配置" required>
          </label>
          <label>
            <span>URL 标识</span>
            <div class="input-prefix"><span>/api/</span><input id="subscription-url" maxlength="64" placeholder="clash-main" required></div>
            <small>字母、数字、点、横线或下划线</small>
          </label>
          <label class="span-two">
            <span>本地文件路径</span>
            <div class="file-path-input">
              <input id="subscription-file" maxlength="1024" placeholder="/etc/subscriptions/clash.yaml" required>
              <button id="open-file-browser" class="button button-secondary" type="button">选择服务器文件</button>
            </div>
          </label>
          <label class="span-two">
            <span>访问 token</span>
            <div class="token-input"><input id="subscription-token" type="password" minlength="8" maxlength="128" placeholder="留空则自动生成"><button id="toggle-token" class="inside-button" type="button">显示</button></div>
            <small id="token-help">创建后仅展示一次，请及时保存</small>
          </label>
          <label class="span-two">
            <span>备注 <i>可选</i></span>
            <textarea id="subscription-note" maxlength="500" rows="3" placeholder="用途、客户端或更新说明"></textarea>
          </label>
        </div>
        <div class="enabled-row">
          <div>
            <strong>立即启用</strong>
          </div>
          <label class="switch">
            <input id="subscription-enabled" type="checkbox" role="switch" checked aria-label="立即启用订阅">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <p id="editor-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button class="button button-secondary" data-action="close-editor" type="button">取消</button>
          <button id="save-button" class="button button-primary" type="submit">保存订阅</button>
        </div>
      </form>
    </section>
  </div>

  <div id="file-browser-backdrop" class="modal-backdrop file-browser-backdrop" hidden>
    <section class="modal file-browser-modal" role="dialog" aria-modal="true" aria-labelledby="file-browser-title">
      <div class="modal-heading">
        <div>
          <h2 id="file-browser-title">选择服务器文件</h2>
        </div>
        <button class="icon-button" data-action="close-file-browser" type="button" aria-label="关闭">×</button>
      </div>

      <div class="file-browser-root">
        <span>允许浏览</span>
        <code id="file-browser-root"></code>
      </div>
      <div class="file-browser-toolbar">
        <button id="file-browser-up" class="button button-secondary" type="button">← 上一级</button>
        <code id="file-browser-current">正在读取…</code>
      </div>
      <div id="file-browser-list" class="file-browser-list" aria-live="polite"></div>
      <p id="file-browser-empty" class="file-browser-empty" hidden>这个目录中没有可选择的文件。</p>
      <p id="file-browser-error" class="form-error" role="alert"></p>
      <div class="modal-actions">
        <button class="button button-secondary" data-action="close-file-browser" type="button">取消</button>
      </div>
    </section>
  </div>

  <div id="token-backdrop" class="modal-backdrop" hidden>
    <section class="modal token-modal" role="dialog" aria-modal="true" aria-labelledby="token-title">
      <div class="success-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#check"></use></svg></div>
      <h2 id="token-title">订阅已保存</h2>
      <p class="muted">Token 仅显示一次，请保存完整地址。</p>
      <label>
        <span>完整订阅地址</span>
        <div class="copy-field"><input id="created-url" readonly><button id="copy-created-url" class="button button-secondary" type="button">复制</button></div>
      </label>
      <button class="button button-primary button-wide" data-action="close-token" type="button">我已保存</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
