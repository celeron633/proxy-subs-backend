<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f9ff">
  <title>安全设置 · Proxy Subs</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/shared.css">
  <link rel="stylesheet" href="/assets/settings.css">
  <script src="/assets/shared.js" defer></script>
  <script src="/assets/settings.js" defer></script>
</head>
<body>
  <div class="app-shell">
<aside class="sidebar" aria-label="主导航">
      <a class="wordmark" href="/dashboard"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#layers"></use></svg></span>Proxy Subs</a>
      <nav class="side-nav">
        <a class="nav-item" href="/dashboard" ><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#grid"></use></svg>订阅管理</a>
        <a class="nav-item" href="/settings" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#shield"></use></svg>安全设置</a>
      </nav>
    </aside>
    <header class="topbar">
      <h1>安全设置</h1>
      <div class="account"><span id="account-name">管理员</span><button id="logout-button" class="button button-quiet" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#logout"></use></svg>退出</button></div>
    </header>
  <main class="settings-page">
    <section class="settings-card" aria-labelledby="protection-title">
      <div class="setting-row">
        <div>
          <h2 id="protection-title">错误访问保护</h2>
          <p>按 IP 限制连续失败的登录和 API 请求。</p>
        </div>
        <label class="switch">
          <input id="protection-switch" type="checkbox" role="switch" aria-label="错误访问保护开关" disabled>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <details class="protection-rules">
        <summary>查看保护规则</summary>
        <dl class="rule-list">
          <div><dt>登录 / API</dt><dd>分别计数，30 分钟内连续失败 5 次，封禁 30 分钟。成功访问后清零。</dd></div>
          <div><dt>验证码</dt><dd>7 位，区分大小写，5 分钟有效；不受此开关影响。</dd></div>
        </dl>
      </details>

      <div class="settings-actions">
        <p id="setting-state" class="muted"></p>
        <button id="save-settings" class="button button-primary" type="button" disabled>保存设置</button>
      </div>
    </section>
  </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
