name: Build release packages

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package Windows and Linux amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          app="proxy-subs-backend"
          stage="dist/stage"
          windows_dir="$stage/${app}-windows-amd64"
          linux_dir="$stage/${app}-linux-amd64"

          mkdir -p "$windows_dir" "$linux_dir"

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$windows_dir/${app}.exe" .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$linux_dir/${app}" .

          cp -r web static "$windows_dir/"
          cp README.md LICENSE "$windows_dir/"

          cp -r web static "$linux_dir/"
          cp README.md LICENSE start.sh stop.sh "$linux_dir/"
          chmod +x "$linux_dir/${app}" "$linux_dir/start.sh" "$linux_dir/stop.sh"

          (
            cd "$stage"
            zip -qr "../${app}-windows-amd64.zip" "${app}-windows-amd64"
            tar -czf "../${app}-linux-amd64.tar.gz" "${app}-linux-amd64"
          )

          (
            cd dist
            sha256sum "${app}-windows-amd64.zip" "${app}-linux-amd64.tar.gz" > checksums.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proxy-subs-backend-packages-${{ github.run_number }}
          path: |
            dist/proxy-subs-backend-windows-amd64.zip
            dist/proxy-subs-backend-linux-amd64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/proxy-subs-backend-windows-amd64.zip
            dist/proxy-subs-backend-linux-amd64.tar.gz
            dist/checksums.txt
